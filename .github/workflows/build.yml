name: CI/CD Debug Build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate short SHA
        id: set-short-sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Find all APKs
        run: |
          echo "===== APK FILES ====="
          find app/build -type f -name "*.apk"

      - name: Upload ARM64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-arm64-v8a-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Upload armeabi-v7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-armeabi-v7a-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-universal-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/app-universal-debug.apk

      - name: Upload x86 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-x86-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/app-x86-debug.apk

      - name: Upload x86_64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvRex-x86_64-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk