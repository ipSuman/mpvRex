name: Linux final build

on:
  push:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Save Log update
        run: python3 linux/apply_log_update.py

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libmpv-dev
          git diff --check
          cmake -S linux -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --parallel

      - name: Package Linux build
        run: |
          mkdir -p dist/rex-player-linux
          cp build-linux/rex-player dist/rex-player-linux/rex-player-bin
          cp linux/rex-player-launcher.sh dist/rex-player-linux/rex-player
          chmod +x dist/rex-player-linux/rex-player
          cp linux/README.md dist/rex-player-linux/
          tar -C dist -czf rex-player-linux.tar.gz rex-player-linux

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linux/src/MainWindow.h linux/src/MainWindow.cpp
          git commit -m "Add diagnostic log report button"
          git push

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: rex-player-linux
          path: rex-player-linux.tar.gz
          retention-days: 30

      - name: Remove temporary files
        if: success()
        run: |
          git rm .github/workflows/apply-log-report.yml linux/apply_log_update.py linux/.build-trigger
          git commit -m "Remove temporary Linux build files"
          git push
