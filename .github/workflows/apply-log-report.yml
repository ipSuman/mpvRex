name: Add Linux log report

on:
  push:
    branches: [linux]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply log report changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          h = Path("linux/src/MainWindow.h")
          s = h.read_text()
          s = s.replace("    void cutAbSelection();\n", "    void cutAbSelection();\n    void saveLogReport();\n")
          s = s.replace("    QPushButton* m_cutAbButton = nullptr;\n", "    QPushButton* m_cutAbButton = nullptr;\n    QPushButton* m_logButton = nullptr;\n")
          h.write_text(s)

          cpp = Path("linux/src/MainWindow.cpp")
          s = cpp.read_text()
          s = s.replace("#include <QPushButton>\n", "#include <QPushButton>\n#include <QDateTime>\n#include <QSysInfo>\n#include <QTextStream>\n")

          old = '''    connect(m_cutAbButton, &QPushButton::clicked, this, &MainWindow::cutAbSelection);\n    row->addWidget(m_cutAbButton);\n    m_hwButton = new QPushButton(QStringLiteral("SW"), m_controls);'''
          new = '''    connect(m_cutAbButton, &QPushButton::clicked, this, &MainWindow::cutAbSelection);\n    row->addWidget(m_cutAbButton);\n    m_logButton = new QPushButton(QStringLiteral("Save Log"), m_controls);\n    m_logButton->setFixedWidth(72);\n    m_logButton->setToolTip(QStringLiteral("Save a diagnostic log report"));\n    connect(m_logButton, &QPushButton::clicked, this, &MainWindow::saveLogReport);\n    row->addWidget(m_logButton);\n    m_hwButton = new QPushButton(QStringLiteral("SW"), m_controls);'''
          if old not in s: raise SystemExit("log button insertion point not found")
          s = s.replace(old, new)

          old = '''void MainWindow::updateHardwareButton() {'''
          new = r'''void MainWindow::saveLogReport() {
    const QString timestamp = QDateTime::currentDateTime().toString(QStringLiteral("yyyyMMdd_HHmmss"));
    const QString defaultName = QDir::home().filePath(QStringLiteral("REX_Player_Log_%1.txt").arg(timestamp));
    const QString path = QFileDialog::getSaveFileName(
        this, QStringLiteral("Save REX Player log report"), defaultName,
        QStringLiteral("Text files (*.txt);;All files (*)"));
    if (path.isEmpty()) return;

    QFile file(path);
    if (!file.open(QIODevice::WriteOnly | QIODevice::Text | QIODevice::Truncate)) {
        QMessageBox::warning(this, QStringLiteral("Save Log"),
                             QStringLiteral("Could not write the log report:\n%1").arg(file.errorString()));
        return;
    }

    QTextStream out(&file);
    out << "REX Player — Diagnostic Log Report\n";
    out << "==================================\n\n";
    out << "Generated: " << QDateTime::currentDateTime().toString(Qt::ISODate) << "\n";
    out << "Application: " << QCoreApplication::applicationName() << " " << QCoreApplication::applicationVersion() << "\n";
    out << "Qt: " << QT_VERSION_STR << "\n";
    out << "OS: " << QSysInfo::prettyProductName() << "\n";
    out << "Kernel: " << QSysInfo::kernelType() << " " << QSysInfo::kernelVersion() << "\n";
    out << "CPU architecture: " << QSysInfo::currentCpuArchitecture() << "\n";
    out << "Build ABI: " << QSysInfo::buildAbi() << "\n";
    out << "Host name: " << QSysInfo::machineHostName() << "\n";
    out << "Locale LC_NUMERIC: " << qgetenv("LC_NUMERIC") << "\n";
    out << "Qt platform: " << qgetenv("QT_QPA_PLATFORM") << "\n";
    out << "Wayland display: " << qgetenv("WAYLAND_DISPLAY") << "\n";
    out << "X11 display: " << qgetenv("DISPLAY") << "\n\n";

    out << "Playback / Media\n";
    out << "----------------\n";
    const QList<QPair<QString, QString>> properties = {
        {QStringLiteral("path"), QStringLiteral("Path")},
        {QStringLiteral("filename"), QStringLiteral("Filename")},
        {QStringLiteral("media-title"), QStringLiteral("Media title")},
        {QStringLiteral("file-format"), QStringLiteral("Container")},
        {QStringLiteral("duration"), QStringLiteral("Duration")},
        {QStringLiteral("bitrate"), QStringLiteral("Overall bitrate")},
        {QStringLiteral("video-codec"), QStringLiteral("Video codec")},
        {QStringLiteral("video-format"), QStringLiteral("Video format")},
        {QStringLiteral("video-params/w"), QStringLiteral("Video width")},
        {QStringLiteral("video-params/h"), QStringLiteral("Video height")},
        {QStringLiteral("container-fps"), QStringLiteral("Container FPS")},
        {QStringLiteral("video-bitrate"), QStringLiteral("Video bitrate")},
        {QStringLiteral("video-params/pixelformat"), QStringLiteral("Pixel format")},
        {QStringLiteral("video-params/chroma-location"), QStringLiteral("Chroma location")},
        {QStringLiteral("video-params/colormatrix"), QStringLiteral("Color matrix")},
        {QStringLiteral("video-params/primaries"), QStringLiteral("Color primaries")},
        {QStringLiteral("video-params/transfer"), QStringLiteral("Color transfer")},
        {QStringLiteral("video-params/rotate"), QStringLiteral("Rotation")},
        {QStringLiteral("audio-codec"), QStringLiteral("Audio codec")},
        {QStringLiteral("audio-format"), QStringLiteral("Audio format")},
        {QStringLiteral("audio-samplerate"), QStringLiteral("Audio sample rate")},
        {QStringLiteral("audio-channels"), QStringLiteral("Audio channels")},
        {QStringLiteral("audio-channel-layout"), QStringLiteral("Audio channel layout")},
        {QStringLiteral("audio-bitrate"), QStringLiteral("Audio bitrate")},
        {QStringLiteral("hwdec"), QStringLiteral("HW decoder setting")},
        {QStringLiteral("hwdec-current"), QStringLiteral("Active HW decoder")},
        {QStringLiteral("vo"), QStringLiteral("Video output")},
        {QStringLiteral("gpu-api"), QStringLiteral("GPU API")},
        {QStringLiteral("time-pos"), QStringLiteral("Position")},
        {QStringLiteral("pause"), QStringLiteral("Paused")},
        {QStringLiteral("speed"), QStringLiteral("Speed")},
        {QStringLiteral("video-zoom"), QStringLiteral("Video zoom")},
        {QStringLiteral("video-pan-x"), QStringLiteral("Video pan X")},
        {QStringLiteral("video-pan-y"), QStringLiteral("Video pan Y")}
    };
    for (const auto& property : properties) {
        const QString value = getPropertyString(property.first.toUtf8().constData());
        if (!value.isEmpty()) out << property.second << ": " << value << "\n";
    }

    out << "\nTracks\n------\n";
    mpv_node tracks{};
    if (m_mpv && mpv_get_property(m_mpv, "track-list", MPV_FORMAT_NODE, &tracks) >= 0) {
        if (tracks.format == MPV_FORMAT_NODE_ARRAY && tracks.u.list) {
            for (int i = 0; i < tracks.u.list->num; ++i) {
                const mpv_node* track = &tracks.u.list->values[i];
                const mpv_node* type = mapValue(track->u.list, "type");
                const mpv_node* id = mapValue(track->u.list, "id");
                const mpv_node* lang = mapValue(track->u.list, "lang");
                const mpv_node* title = mapValue(track->u.list, "title");
                const mpv_node* codec = mapValue(track->u.list, "codec");
                const mpv_node* external = mapValue(track->u.list, "external-filename");
                const mpv_node* selected = mapValue(track->u.list, "selected");
                out << "Track " << (i + 1)
                    << ": type=" << nodeString(type)
                    << ", id=" << nodeInt(id)
                    << ", lang=" << nodeString(lang)
                    << ", title=" << nodeString(title)
                    << ", codec=" << nodeString(codec)
                    << ", external=" << nodeString(external)
                    << ", selected=" << (nodeFlag(selected) ? "yes" : "no") << "\n";
            }
        }
        mpv_free_node_contents(&tracks);
    } else {
        out << "Unable to read track-list.\n";
    }

    out << "\nA-B / Controls\n--------------\n";
    out << "A-B start: " << m_abLoopStart << "\n";
    out << "A-B end: " << m_abLoopEnd << "\n";
    out << "Seek duration (minutes): " << m_seekDurationMinutes << "\n";
    out << "Seek wheel: " << m_seekWheelMode << "\n";
    out << "Zoom wheel: " << m_zoomWheelMode << "\n";
    out << "Volume wheel: " << m_volumeWheelMode << "\n";
    out << "Pan button: " << static_cast<int>(m_panButton) << "\n";
    out << "Double-click button: " << static_cast<int>(m_doubleClickButton) << "\n";
    out << "Double-click zones: " << (m_doubleClickZones ? "enabled" : "disabled") << "\n";
    out << "Seek backward shortcut: " << m_seekBackwardKey.toString() << "\n";
    out << "Seek forward shortcut: " << m_seekForwardKey.toString() << "\n";
    out << "Loop A shortcut: " << m_loopAKey.toString() << "\n";
    out << "Loop B shortcut: " << m_loopBKey.toString() << "\n";
    out << "Loop clear shortcut: " << m_loopClearKey.toString() << "\n";
    out << "Zoom in shortcut: " << m_zoomInKey.toString() << "\n";
    out << "Zoom out shortcut: " << m_zoomOutKey.toString() << "\n";
    out << "Zoom reset shortcut: " << m_zoomResetKey.toString() << "\n";
    out << "Frame back shortcut: " << m_frameBackKey.toString() << "\n";
    out << "Frame forward shortcut: " << m_frameForwardKey.toString() << "\n";

    out << "\nPlaylist\n--------\n";
    if (m_playlist) {
        out << "Count: " << m_playlist->count() << "\n";
        out << "Current index: " << m_currentPlaylistIndex << "\n";
        for (int i = 0; i < m_playlist->count(); ++i) {
            out << (i + 1) << ": " << m_playlist->item(i)->data(Qt::UserRole).toString() << "\n";
        }
    }

    out << "\nEnd of report\n";
    file.close();
    QMessageBox::information(this, QStringLiteral("Log saved"),
                             QStringLiteral("Diagnostic report saved to:\n%1").arg(path));
}

void MainWindow::updateHardwareButton() {'''
          if old not in s: raise SystemExit("log method insertion point not found")
          s = s.replace(old, new)

          cpp.write_text(s)

          readme = Path("linux/README.md")
          s = readme.read_text()
          s = s.replace(
              "- A-B stream-copy cutting through FFmpeg, preserving all mapped streams without re-encoding\n",
              "- A-B stream-copy cutting through FFmpeg, preserving all mapped streams without re-encoding\n- **Save Log** button for a diagnostic report containing system, playback, codec, track and control details\n"
          )
          readme.write_text(s)
          PY

      - name: Build and verify
        run: |
          git diff --check
          cmake -S linux -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --parallel

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linux/src/MainWindow.h linux/src/MainWindow.cpp linux/README.md
          git commit -m "Add diagnostic log report button"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/apply-log-report.yml || true
          git commit -m "Remove temporary log report workflow" || true
          git push || true
