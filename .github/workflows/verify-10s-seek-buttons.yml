name: Verify 10s seek buttons

on:
  push:
    branches: [linux]
    paths:
      - '.github/workflows/verify-10s-seek-buttons.yml'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libmpv-dev
      - name: Configure
        run: cmake -S linux -B build-linux -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-linux --parallel
