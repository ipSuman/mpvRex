name: Linux Player Build

on:
  push:
    branches: [linux]
  pull_request:
    branches: [master, linux]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libmpv-dev

      - name: Configure
        run: cmake -S linux -B linux/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build linux/build --parallel

      - name: Package binary
        run: |
          mkdir -p linux/dist
          cp linux/build/rex-player linux/dist/rex-player

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: rex-player-linux-x86_64
          path: linux/dist/rex-player
