name: REX Player Linux Final

on:
  push:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libmpv-dev

      - name: Restore verified Linux source
        run: |
          git checkout 6c9bbcaf79229b68c6e6afe56c7a9ed9a9923c06 -- linux/src/MainWindow.h linux/src/MainWindow.cpp

      - name: Apply double-tap seek update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("linux/src/MainWindow.cpp")
          s = p.read_text()
          old = """            if (x < width / 3.0) seekBackward();
            else if (x > width * 2.0 / 3.0) seekForward();
            else togglePause();"""
          new = """            if (x < width / 3.0) {
                const char* args[] = {"seek", "-10", "relative", "exact", nullptr};
                command(args);
            } else if (x > width * 2.0 / 3.0) {
                const char* args[] = {"seek", "10", "relative", "exact", nullptr};
                command(args);
            } else {
                togglePause();
            }"""
          if old not in s:
              raise SystemExit("double-tap handler not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Configure
        run: cmake -S linux -B build-linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-linux --parallel

      - name: Package Linux launcher and binary
        run: |
          mkdir -p dist/rex-player-linux
          cp build-linux/rex-player dist/rex-player-linux/rex-player-bin
          cp linux/rex-player-launcher.sh dist/rex-player-linux/rex-player
          chmod +x dist/rex-player-linux/rex-player
          cp linux/README.md dist/rex-player-linux/
          tar -C dist -czf rex-player-linux.tar.gz rex-player-linux

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linux/src/MainWindow.h linux/src/MainWindow.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Set double-tap seek to fixed 10 seconds [skip ci]"
            git push
          fi

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: rex-player-linux
          path: rex-player-linux.tar.gz
          retention-days: 30
