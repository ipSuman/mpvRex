name: Finalize Linux button sizing

on:
  push:
    branches: [linux]

jobs:
  finalize:
    if: github.event.head_commit.message != 'Fix Cut AB and Save Log button sizing'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply and build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('linux/src/MainWindow.cpp')
          s = p.read_text()
          old1 = 'm_cutAbButton->setFixedWidth(62);'
          old2 = 'm_logButton->setFixedWidth(72);'
          if old1 in s:
              s = s.replace(old1, 'm_cutAbButton->setMinimumWidth(76);\n    m_cutAbButton->setSizePolicy(QSizePolicy::Preferred, QSizePolicy::Fixed);', 1)
          if old2 in s:
              s = s.replace(old2, 'm_logButton->setMinimumWidth(84);\n    m_logButton->setSizePolicy(QSizePolicy::Preferred, QSizePolicy::Fixed);', 1)
          p.write_text(s)
          PY
          grep -A3 'm_cutAbButton = ' linux/src/MainWindow.cpp
          grep -A3 'm_logButton = ' linux/src/MainWindow.cpp
          git diff --check
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev libmpv-dev
          cmake -S linux -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --parallel
      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add linux/src/MainWindow.cpp
          git commit -m "Fix Cut AB and Save Log button sizing"
          git push --force origin HEAD:linux
      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin linux
          git checkout -B linux origin/linux
          git rm -f .github/workflows/finalize-button-size.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary button size workflow" || true
          git push --force origin HEAD:linux || true
